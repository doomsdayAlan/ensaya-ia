# Deploy Ensaya IA en Railway.
# Preferencia: Dockerfile en la raiz (Node 22.12 + verify dist). Si el panel fuerza
# Railpack, usa el buildCommand de abajo. Overrides del dashboard pisan este archivo.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Fallback si el servicio usa Railpack en vez del Dockerfile:
# buildCommand = "npm ci --include=dev && npm run build && node scripts/verify-railway-dist.mjs"

[deploy]
startCommand = "node railway-server.mjs"
healthcheckPath = "/og-ensaya-ia.jpg"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
