# Deploy Ensaya IA en Railway (Railpack).
# Si el panel del servicio define Build/Start distintos, prevalece el panel:
# alinea esos campos con este archivo o vacía el override del dashboard.

[build]
builder = "RAILPACK"
# --include=dev: Vite vive en devDependencies y debe instalarse en el build.
# verify: aborta si public/og no llego a dist/client (evita publicar un artefacto roto).
buildCommand = "npm ci --include=dev && npm run build && node scripts/verify-railway-dist.mjs"

[deploy]
startCommand = "npm run start"
# Si falta la imagen OG, el deploy nuevo no pasa healthcheck (no sustituye un build bueno a medias).
healthcheckPath = "/og-ensaya-ia.jpg"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
