# Una sola via de build: Dockerfile (no Nixpacks / Railpack).
# Si el panel del servicio define otro builder o Build/Start Command, ese override gana:
# borra los overrides del dashboard para respetar este archivo.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Debe coincidir con CMD del Dockerfile: sirve dist/ generado en el build.
startCommand = "node railway-server.mjs"
healthcheckPath = "/og-ensaya-ia.jpg"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
